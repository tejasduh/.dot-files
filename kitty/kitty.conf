## ~/.config/kitty/kitty.conf

# ── Shell ──
shell /usr/bin/fish

# ── Font ──
font_family         SF Mono
font_size           13.0
adjust_line_height  110%
disable_ligatures   never

# ── Cursor ──
cursor_shape                  beam
cursor_beam_thickness         1.8
cursor_blink_interval         0.5
cursor                        #ff8fa8
cursor_text_color             #2b0a12
cursor_trail                  3
cursor_trail_start_threshold  2
cursor_trail_decay            0.1 0.4

# ── Window ──
hide_window_decorations   no
confirm_os_window_close   0

# ── Transparency & Blur ──
background_opacity          0.78
dynamic_background_opacity  yes
background_blur              48

# ── Mouse ──
mouse_hide_wait   3.0

# ── Theme: Maroon / Plum / Pink ──
foreground              #f2e3ea
background              #1c0a12
selection_foreground    #7a3040
selection_background    #ffa6bf
url_color               #ff8fa8

# black
color0   #2b0a12
color8   #5a1c26
# red
color1   #ca3a54
color9   #eb6f92
# green (muted, stays out of the way)
color2   #7a3b45
color10  #b5717d
# yellow → dusty gold-pink
color3   #f6c177
color11  #f2c9a1
# blue → muted plum
color4   #6e2a3a
color12  #b03060
# magenta → core pink accent
color5   #ff6f91
color13  #ffa6bf
# cyan → pale pink-white
color6   #ebbcba
color14  #ffd6e0
# white
color7   #f2e3ea
color15  #ffffff

# ── Tab bar ──
tab_bar_edge              top
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_background         #1c0a12
active_tab_foreground      #1c0a12
active_tab_background      #ff8fa8
inactive_tab_foreground    #d98a9d
inactive_tab_background    #2b0a12

# ── Borders ──
active_border_color     #ff8fa8
inactive_border_color   #5a1c26 
